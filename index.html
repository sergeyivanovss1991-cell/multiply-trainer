<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7fb" />
  <title>Умножайка</title>
  <style>:root {
  font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #202033;
  background: #f7f7fb;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #f7f7fb; }
body { min-height: 100vh; min-height: 100dvh; }
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app-shell {
  width: min(100%, 520px);
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;
  padding: max(18px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}

.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.home {
  justify-content: center;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: .01em;
}

.brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: #6c63ff;
  color: #fff;
  box-shadow: 0 8px 20px rgba(108,99,255,.22);
}

.hero-card, .panel, .result-card {
  background: #fff;
  border: 1px solid #e8e8f0;
  border-radius: 24px;
  box-shadow: 0 14px 40px rgba(43,43,80,.07);
}

.hero-card { padding: 24px; }
.hello { margin: 0 0 8px; font-size: clamp(28px, 7vw, 38px); line-height: 1.05; }
.subtitle { margin: 0; color: #6b6b7b; font-size: 16px; line-height: 1.45; }

.primary-btn, .secondary-btn, .answer-btn, .key-btn {
  border: 0;
  border-radius: 18px;
  min-height: 54px;
  font-weight: 800;
  cursor: pointer;
}

.primary-btn {
  width: 100%;
  min-height: 68px;
  background: #6c63ff;
  color: #fff;
  font-size: 20px;
  box-shadow: 0 12px 26px rgba(108,99,255,.28);
}
.primary-btn:active { transform: translateY(1px) scale(.995); }
.secondary-btn { background: #ececf5; color: #2f2f45; width: 100%; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.stat {
  background: #fff;
  border: 1px solid #e8e8f0;
  border-radius: 18px;
  padding: 14px 10px;
  text-align: center;
}
.stat strong { display: block; font-size: 21px; }
.stat span { display: block; margin-top: 4px; color: #777788; font-size: 12px; }

.progress-wrap { margin-top: 2px; }
.progress-label { display: flex; justify-content: space-between; margin-bottom: 8px; color: #6b6b7b; font-size: 13px; }
.progress-track { height: 10px; background: #ececf3; border-radius: 999px; overflow: hidden; }
.progress-bar { height: 100%; background: #6c63ff; border-radius: inherit; transition: width .25s ease; }

.training { justify-content: space-between; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.question-count, .mini-stars {
  color: #666679;
  font-size: 14px;
  font-weight: 700;
}

.problem-card {
  position: relative;
  background: #fff;
  border: 1px solid #e8e8f0;
  border-radius: 28px;
  min-height: 230px;
  padding: 24px;
  display: grid;
  place-items: center;
  text-align: center;
  box-shadow: 0 16px 44px rgba(43,43,80,.08);
  overflow: hidden;
}
.problem {
  font-size: clamp(48px, 15vw, 76px);
  font-weight: 900;
  letter-spacing: -.04em;
  line-height: 1;
}
.answer-display {
  margin-top: 18px;
  min-width: 120px;
  min-height: 58px;
  padding: 9px 18px;
  border-radius: 16px;
  background: #f2f2f8;
  font-size: 34px;
  font-weight: 900;
  color: #323248;
}
.answer-display.empty { color: #aaaabb; }
.feedback {
  margin-top: 10px;
  min-height: 30px;
  font-size: 18px;
  font-weight: 900;
}
.feedback.good { color: #168a57; }
.feedback.bad { color: #ca4b55; }

.keyboard {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.key-btn {
  background: #fff;
  border: 1px solid #e6e6ee;
  min-height: 58px;
  font-size: 23px;
  color: #25253b;
  box-shadow: 0 5px 16px rgba(43,43,80,.04);
}
.key-btn:active { background: #f0f0f7; }
.key-btn.utility { background: #ececf5; }
.answer-btn {
  grid-column: 1 / -1;
  min-height: 62px;
  background: #23233a;
  color: #fff;
  font-size: 18px;
}
.answer-btn:disabled { opacity: .4; cursor: default; }

.result-card { padding: 22px; }
.result-title { margin: 0; font-size: 30px; }
.result-score {
  margin: 16px 0 4px;
  font-size: 52px;
  line-height: 1;
  font-weight: 900;
}
.result-caption { margin: 0; color: #737385; }
.result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 18px; }
.result-metric { background: #f7f7fb; border-radius: 16px; padding: 14px; }
.result-metric strong { display: block; font-size: 22px; }
.result-metric span { color: #7b7b8d; font-size: 12px; }

.weak-list { display: grid; gap: 9px; margin-top: 14px; }
.weak-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fff4e8; border-radius: 14px; padding: 11px 13px; }
.weak-item strong { font-size: 17px; }
.weak-item span { color: #8b6844; font-size: 12px; }

.actions { display: grid; gap: 10px; }

.pop {
  animation: pop .28s ease;
}
.shake {
  animation: shake .3s ease;
}
.star-burst {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.star-burst span {
  position: absolute;
  left: 50%;
  top: 50%;
  font-size: 22px;
  animation: burst .55s ease-out forwards;
}
.star-burst span:nth-child(1){ --x:-80px; --y:-70px; }
.star-burst span:nth-child(2){ --x:70px; --y:-60px; }
.star-burst span:nth-child(3){ --x:-60px; --y:70px; }
.star-burst span:nth-child(4){ --x:75px; --y:65px; }

@keyframes pop { 0%{transform:scale(.96)} 60%{transform:scale(1.025)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
@keyframes burst { from { opacity:1; transform: translate(-50%,-50%) scale(.6); } to { opacity:0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.2); } }

@media (min-width: 700px) {
  .app-shell { padding-top: 34px; padding-bottom: 34px; }
  .problem-card { min-height: 280px; }
  .key-btn { min-height: 64px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

:focus-visible { outline: 3px solid #8d86ff; outline-offset: 3px; }
</style>

<body>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <script>function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

/**
 * Mastery 0..100.
 * Accuracy is intentionally scaled by confidence, so one correct answer cannot
 * instantly produce a high mastery. Repeated correct answers, experience and
 * a streak raise confidence; a most-recent wrong answer adds a penalty.
 */
function calculateMastery(fact) {
  if (!fact || fact.attempts <= 0) return 0;

  const accuracy = fact.correct / fact.attempts;
  const confidence = Math.min(fact.attempts / 6, 1);
  const streakConfidence = Math.min(fact.correctStreak / 5, 1);

  const accuracyScore = accuracy * 60 * confidence;
  const experienceScore = 20 * confidence;
  const streakScore = 20 * streakConfidence;

  const lastOutcomeWasWrong = Boolean(
    fact.lastWrongAt && (!fact.lastCorrectAt || fact.lastWrongAt > fact.lastCorrectAt)
  );
  const recentWrongPenalty = lastOutcomeWasWrong ? 15 : 0;

  return clamp(
    Math.round(accuracyScore + experienceScore + streakScore - recentWrongPenalty),
    0,
    100,
  );
}



const STORAGE_KEY = 'multiplyTrainer.state';
const SCHEMA_VERSION = 1;

function factKey(a, b) {
  return `${a}x${b}`;
}

function createFact(a, b) {
  return {
    a,
    b,
    attempts: 0,
    correct: 0,
    wrong: 0,
    correctStreak: 0,
    averageResponseMs: 0,
    lastAskedAt: null,
    lastCorrectAt: null,
    lastWrongAt: null,
    mastery: 0,
  };
}

function createDefaultState() {
  const facts = {};
  for (let a = 2; a <= 10; a += 1) {
    for (let b = 2; b <= 10; b += 1) {
      facts[factKey(a, b)] = createFact(a, b);
    }
  }

  return {
    version: SCHEMA_VERSION,
    profile: { name: 'Полина' },
    settings: {
      tables: [2, 3, 4, 5, 6, 7, 8, 9, 10],
      sessionLength: 20,
    },
    facts,
    stats: {
      totalSessions: 0,
      totalAnswers: 0,
      totalCorrect: 0,
      totalWrong: 0,
      totalStars: 0,
      bestStreak: 0,
      currentStreak: 0,
      lastTrainingDate: null,
      daily: { date: null, answered: 0, correct: 0 },
    },
    rewards: { stars: 0 },
  };
}

function isShapeUsable(value) {
  return Boolean(
    value &&
    typeof value === 'object' &&
    value.version === SCHEMA_VERSION &&
    value.profile &&
    value.settings &&
    value.facts &&
    value.stats &&
    value.rewards
  );
}

function loadState(storage = globalThis.localStorage) {
  if (!storage) return createDefaultState();

  const raw = storage.getItem(STORAGE_KEY);
  if (!raw) return createDefaultState();

  try {
    const parsed = JSON.parse(raw);
    if (!isShapeUsable(parsed)) return createDefaultState();
    return parsed;
  } catch {
    try {
      storage.setItem(`multiplyTrainer.corrupt.${Date.now()}`, raw);
    } catch {
      // Keep running even when storage quota/security rules block backup.
    }
    return createDefaultState();
  }
}

function saveState(state, storage = globalThis.localStorage) {
  if (!storage) return;
  storage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function localDateKey(now = new Date()) {
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function ensureTodayStats(state, now = new Date()) {
  const today = localDateKey(now);
  if (state.stats.daily.date !== today) {
    state.stats.daily = { date: today, answered: 0, correct: 0 };
  }
}

function applyAnswerToFact(fact, { isCorrect, responseMs, answeredAt = Date.now() }) {
  const previousAttempts = fact.attempts;
  fact.attempts += 1;
  fact.lastAskedAt = answeredAt;

  if (isCorrect) {
    fact.correct += 1;
    fact.correctStreak += 1;
    fact.lastCorrectAt = answeredAt;
  } else {
    fact.wrong += 1;
    fact.correctStreak = 0;
    fact.lastWrongAt = answeredAt;
  }

  fact.averageResponseMs = previousAttempts === 0
    ? responseMs
    : Math.round(((fact.averageResponseMs * previousAttempts) + responseMs) / fact.attempts);

  fact.mastery = calculateMastery(fact);
  return fact;
}


function pickRandom(items, rng) {
  return items[Math.floor(rng() * items.length)];
}

function weightedPick(items, weightFn, rng) {
  if (items.length === 1) return items[0];
  const weights = items.map((item) => Math.max(0.001, weightFn(item)));
  const total = weights.reduce((sum, value) => sum + value, 0);
  let needle = rng() * total;
  for (let i = 0; i < items.length; i += 1) {
    needle -= weights[i];
    if (needle <= 0) return items[i];
  }
  return items[items.length - 1];
}

function isWeakFact(fact) {
  if (fact.attempts <= 0) return false;

  const lastOutcomeWasWrong = Boolean(
    fact.lastWrongAt && (!fact.lastCorrectAt || fact.lastWrongAt > fact.lastCorrectAt)
  );
  const errorRate = fact.wrong / fact.attempts;
  const persistentErrors = fact.attempts >= 4 && errorRate >= 0.35 && fact.correctStreak < 3;

  return fact.mastery < 60 || lastOutcomeWasWrong || persistentErrors;
}

function isReviewFact(fact) {
  return fact.attempts > 0 && !isWeakFact(fact);
}

function scheduleWrongRepeat(queue, key, currentQuestionIndex, rng = Math.random) {
  const due = currentQuestionIndex + 4 + Math.floor(rng() * 4); // 3..6 intervening questions
  const existing = queue.find((item) => item.key === key && item.dueAtQuestion > currentQuestionIndex);
  if (existing) {
    existing.dueAtQuestion = Math.min(existing.dueAtQuestion, due);
    return queue;
  }
  queue.push({ key, dueAtQuestion: due });
  return queue;
}

function chooseNextFact({
  facts,
  enabledTables,
  scheduledQueue = [],
  questionIndex,
  lastKey = null,
  rng = Math.random,
  now = Date.now(),
}) {
  const all = Object.entries(facts)
    .filter(([, fact]) => enabledTables.includes(fact.a))
    .map(([key, fact]) => ({ key, fact }));

  if (all.length === 0) throw new Error('No enabled multiplication facts');

  const dueScheduled = scheduledQueue
    .filter((item) => item.dueAtQuestion <= questionIndex)
    .map((item) => all.find((candidate) => candidate.key === item.key))
    .filter(Boolean)
    .filter((candidate) => candidate.key !== lastKey);

  if (dueScheduled.length > 0) {
    const chosen = dueScheduled[0];
    const index = scheduledQueue.findIndex((item) => item.key === chosen.key && item.dueAtQuestion <= questionIndex);
    if (index >= 0) scheduledQueue.splice(index, 1);
    return chosen;
  }

  const pool = all.length > 1 ? all.filter((candidate) => candidate.key !== lastKey) : all;
  const weak = pool.filter(({ fact }) => isWeakFact(fact));
  const review = pool.filter(({ fact }) => isReviewFact(fact));
  const other = pool.filter(({ fact }) => fact.attempts === 0 || (!isWeakFact(fact) && !isReviewFact(fact)));

  const roll = rng();
  let group;
  if (roll < 0.5 && weak.length) group = weak;
  else if (roll < 0.8 && review.length) group = review;
  else if (other.length) group = other;
  else if (weak.length) group = weak;
  else if (review.length) group = review;
  else group = pool;

  if (group === weak) {
    return weightedPick(group, ({ fact }) => {
      const lowMastery = 1 + ((100 - fact.mastery) / 20);
      const errorWeight = Math.min(fact.wrong, 5) * 0.6;
      const lastWasWrong = fact.lastWrongAt && (!fact.lastCorrectAt || fact.lastWrongAt > fact.lastCorrectAt) ? 2 : 0;
      return lowMastery + errorWeight + lastWasWrong;
    }, rng);
  }

  if (group === review) {
    return weightedPick(group, ({ fact }) => {
      const ageHours = fact.lastAskedAt ? Math.max(1, (now - fact.lastAskedAt) / 3_600_000) : 24;
      return 1 + Math.min(ageHours / 24, 7);
    }, rng);
  }

  return pickRandom(group, rng);
}



const app = document.querySelector('#app');
let state = loadState();
ensureTodayStats(state);
saveState(state);

let session = null;
let feedbackTimer = null;

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function renderHome() {
  clearTimeout(feedbackTimer);
  session = null;
  ensureTodayStats(state);
  const goal = state.settings.sessionLength;
  const dailyAnswered = state.stats.daily.answered;
  const dailyPercent = Math.min(100, Math.round((dailyAnswered / goal) * 100));

  app.innerHTML = `
    <section class="screen home">
      <div class="brand"><div class="brand-mark" aria-hidden="true">×</div>Умножайка</div>
      <div class="hero-card">
        <h1 class="hello">Привет, ${escapeHtml(state.profile.name)}!</h1>
        <p class="subtitle">Готова потренироваться? Всего 20 примеров — и готово.</p>
        <div class="progress-wrap" style="margin-top:22px">
          <div class="progress-label"><span>Сегодня</span><strong>${dailyAnswered}/${goal}</strong></div>
          <div class="progress-track"><div class="progress-bar" style="width:${dailyPercent}%"></div></div>
        </div>
      </div>
      <button class="primary-btn" id="startBtn">Тренироваться</button>
      <div class="stats-grid" aria-label="Прогресс">
        <div class="stat"><strong>⭐ ${state.rewards.stars}</strong><span>звёзды</span></div>
        <div class="stat"><strong>${state.stats.bestStreak}</strong><span>лучшая серия</span></div>
        <div class="stat"><strong>${state.stats.totalSessions}</strong><span>тренировок</span></div>
      </div>
    </section>
  `;
  app.querySelector('#startBtn').addEventListener('click', startSession);
}

function startSession() {
  clearTimeout(feedbackTimer);
  session = {
    index: 0,
    current: null,
    currentAnswer: '',
    questionStartedAt: 0,
    correct: 0,
    wrong: 0,
    starsEarned: 0,
    streak: 0,
    bestStreak: 0,
    scheduledQueue: [],
    lastKey: null,
    answeredFacts: new Map(),
    locked: false,
    feedback: null,
  };
  nextQuestion();
}

function nextQuestion() {
  if (!session) return;
  if (session.index >= state.settings.sessionLength) {
    finishSession();
    return;
  }

  const chosen = chooseNextFact({
    facts: state.facts,
    enabledTables: state.settings.tables,
    scheduledQueue: session.scheduledQueue,
    questionIndex: session.index,
    lastKey: session.lastKey,
  });

  session.current = chosen;
  session.lastKey = chosen.key;
  session.currentAnswer = '';
  session.questionStartedAt = performance.now();
  session.locked = false;
  session.feedback = null;
  renderTraining();
}

function renderTraining() {
  const { fact } = session.current;
  const answer = session.currentAnswer || '—';
  const feedbackClass = session.feedback?.type === 'good' ? 'good' : session.feedback?.type === 'bad' ? 'bad' : '';
  const animationClass = session.feedback?.type === 'good' ? 'pop' : session.feedback?.type === 'bad' ? 'shake' : '';

  app.innerHTML = `
    <section class="screen training">
      <div>
        <div class="top-row">
          <div class="question-count">Вопрос ${session.index + 1} из ${state.settings.sessionLength}</div>
          <div class="mini-stars">⭐ ${state.rewards.stars}</div>
        </div>
        <div class="progress-wrap" style="margin-top:10px">
          <div class="progress-track"><div class="progress-bar" style="width:${(session.index / state.settings.sessionLength) * 100}%"></div></div>
        </div>
      </div>

      <div class="problem-card ${animationClass}" id="problemCard">
        <div>
          <div class="problem">${fact.a} × ${fact.b}</div>
          <div class="answer-display ${session.currentAnswer ? '' : 'empty'}" aria-label="Ваш ответ">${answer}</div>
          <div class="feedback ${feedbackClass}">${session.feedback?.text || ''}</div>
        </div>
        ${session.feedback?.type === 'good' ? '<div class="star-burst" aria-hidden="true"><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span></div>' : ''}
      </div>

      <div class="keyboard" aria-label="Клавиатура ответа">
        ${[1,2,3,4,5,6,7,8,9].map((n) => `<button class="key-btn" data-digit="${n}" aria-label="${n}">${n}</button>`).join('')}
        <button class="key-btn utility" id="backspaceBtn" aria-label="Удалить последнюю цифру">⌫</button>
        <button class="key-btn" data-digit="0" aria-label="0">0</button>
        <button class="key-btn utility" id="clearBtn" aria-label="Очистить ответ">C</button>
        <button class="answer-btn" id="answerBtn" ${!session.currentAnswer || session.locked ? 'disabled' : ''}>Ответить</button>
      </div>
    </section>
  `;

  app.querySelectorAll('[data-digit]').forEach((button) => {
    button.addEventListener('click', () => appendDigit(button.dataset.digit));
  });
  app.querySelector('#backspaceBtn').addEventListener('click', removeDigit);
  app.querySelector('#clearBtn').addEventListener('click', clearAnswer);
  app.querySelector('#answerBtn').addEventListener('click', submitAnswer);
}

function appendDigit(digit) {
  if (!session || session.locked) return;
  if (session.currentAnswer.length >= 3) return;
  if (session.currentAnswer === '0') session.currentAnswer = '';
  session.currentAnswer += digit;
  renderTraining();
}

function removeDigit() {
  if (!session || session.locked) return;
  session.currentAnswer = session.currentAnswer.slice(0, -1);
  renderTraining();
}

function clearAnswer() {
  if (!session || session.locked) return;
  session.currentAnswer = '';
  renderTraining();
}

function submitAnswer() {
  if (!session || session.locked || !session.currentAnswer) return;
  session.locked = true;

  const { key, fact } = session.current;
  const given = Number(session.currentAnswer);
  const expected = fact.a * fact.b;
  const isCorrect = given === expected;
  const responseMs = Math.max(0, Math.round(performance.now() - session.questionStartedAt));
  const now = Date.now();

  applyAnswerToFact(state.facts[key], { isCorrect, responseMs, answeredAt: now });
  ensureTodayStats(state);
  state.stats.totalAnswers += 1;
  state.stats.daily.answered += 1;
  state.stats.lastTrainingDate = now;

  const sessionEntry = session.answeredFacts.get(key) || { key, wrong: 0, correct: 0 };

  if (isCorrect) {
    session.correct += 1;
    session.streak += 1;
    session.bestStreak = Math.max(session.bestStreak, session.streak);
    session.starsEarned += 1;
    state.stats.totalCorrect += 1;
    state.stats.daily.correct += 1;
    state.stats.currentStreak += 1;
    state.stats.bestStreak = Math.max(state.stats.bestStreak, state.stats.currentStreak);
    state.rewards.stars += 1;
    state.stats.totalStars += 1;
    sessionEntry.correct += 1;

    if (session.streak > 0 && session.streak % 5 === 0) {
      session.starsEarned += 2;
      state.rewards.stars += 2;
      state.stats.totalStars += 2;
      session.feedback = { type: 'good', text: 'Серия 5! +3 ⭐' };
    } else {
      session.feedback = { type: 'good', text: 'Отлично! +1 ⭐' };
    }
  } else {
    session.wrong += 1;
    session.streak = 0;
    state.stats.totalWrong += 1;
    state.stats.currentStreak = 0;
    sessionEntry.wrong += 1;
    scheduleWrongRepeat(session.scheduledQueue, key, session.index, Math.random);
    session.feedback = { type: 'bad', text: `Верный ответ: ${expected}` };
  }

  session.answeredFacts.set(key, sessionEntry);
  saveState(state);
  renderTraining();

  feedbackTimer = setTimeout(() => {
    session.index += 1;
    nextQuestion();
  }, 700);
}

function finishSession() {
  state.stats.totalSessions += 1;
  saveState(state);

  const percent = Math.round((session.correct / state.settings.sessionLength) * 100);
  const weak = [...session.answeredFacts.values()]
    .map((entry) => ({ ...entry, fact: state.facts[entry.key] }))
    .filter((entry) => entry.wrong > 0 || entry.fact.mastery < 60)
    .sort((a, b) => (b.wrong - a.wrong) || (a.fact.mastery - b.fact.mastery))
    .slice(0, 5);

  app.innerHTML = `
    <section class="screen" style="justify-content:center">
      <div class="result-card">
        <h1 class="result-title">Тренировка готова!</h1>
        <div class="result-score">${percent}%</div>
        <p class="result-caption">Правильных ответов: ${session.correct} из ${state.settings.sessionLength}</p>
        <div class="result-grid">
          <div class="result-metric"><strong>${session.correct}</strong><span>правильно</span></div>
          <div class="result-metric"><strong>${session.wrong}</strong><span>ошибок</span></div>
          <div class="result-metric"><strong>⭐ ${session.starsEarned}</strong><span>заработано</span></div>
          <div class="result-metric"><strong>${session.bestStreak}</strong><span>лучшая серия</span></div>
        </div>
        ${weak.length ? `
          <h2 style="font-size:18px;margin:22px 0 0">Стоит повторить</h2>
          <div class="weak-list">
            ${weak.map(({ fact, wrong }) => `
              <div class="weak-item">
                <strong>${fact.a} × ${fact.b} = ${fact.a * fact.b}</strong>
                <span>${wrong ? `ошибок: ${wrong}` : `освоено: ${fact.mastery}%`}</span>
              </div>
            `).join('')}
          </div>
        ` : '<p style="margin:22px 0 0;color:#168a57;font-weight:800">Без слабых мест в этой тренировке.</p>'}
      </div>
      <div class="actions">
        <button class="primary-btn" id="againBtn">Ещё раз</button>
        <button class="secondary-btn" id="homeBtn">На главную</button>
      </div>
    </section>
  `;

  app.querySelector('#againBtn').addEventListener('click', startSession);
  app.querySelector('#homeBtn').addEventListener('click', renderHome);
}

window.addEventListener('keydown', (event) => {
  if (!session || session.locked) return;
  if (/^[0-9]$/.test(event.key)) appendDigit(event.key);
  else if (event.key === 'Backspace') removeDigit();
  else if (event.key === 'Escape') clearAnswer();
  else if (event.key === 'Enter') submitAnswer();
});

renderHome();
</script>
</body>
</html>
